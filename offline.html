<body>
<main>
 <div class="mark">PD</div>
 <h1 style="font-size:19px;margin:0 0 6px">Sem conexão</h1>
 <p>O PDIN trabalha com o estado do servidor em tempo real e não opera desconectado. Assim que a rede voltar, tente de novo.</p>
 <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
<script>addEventListener('online',()=>location.reload());</script>
